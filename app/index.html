<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="base.css">
<style>
  main{max-width:30rem}
  .grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--fg);border-radius:.4rem;overflow:hidden;max-width:27rem;aspect-ratio:1;margin:.5rem 0;user-select:none}
  .grid button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:0;font-size:clamp(1rem,5vw,1.5rem);font-weight:600;background:var(--card);position:relative;font-variant-numeric:tabular-nums}
  .grid button:nth-child(9n+3),.grid button:nth-child(9n+6){border-right:2px solid var(--fg)}
  .grid button:nth-child(n+19):nth-child(-n+27),.grid button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--fg)}
  .grid button.given{color:var(--fg)}
  .grid button.mine{color:var(--accent)}
  .grid button.peer{background:color-mix(in srgb,var(--accent) 7%,var(--card))}
  .grid button.same{background:color-mix(in srgb,var(--accent) 18%,var(--card))}
  .grid button.sel{background:color-mix(in srgb,var(--accent) 30%,var(--card))}
  .grid button.wrong{color:var(--bad);text-decoration:underline}
  .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(.45rem,1.6vw,.6rem);font-weight:500;color:var(--muted);line-height:1}
  .notes span{display:flex;align-items:center;justify-content:center}
  .pad{display:grid;grid-template-columns:repeat(9,1fr);gap:.3rem;max-width:27rem}
  .pad button{padding:.55rem 0;font-size:1.1rem;font-weight:600}
  .tools{margin:.5rem 0}
  .tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Sudoku</h1>
  <p class="sub">Fill every row, column and box with 1 to 9.</p>
  <div class="row">
    <label for="level">Level</label>
    <select id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
    <button id="new" class="primary">New puzzle</button>
  </div>
  <div class="stats"><span>Time <b id="time">0:00</b></span><span>Left <b id="left">0</b></span></div>
  <div class="grid" id="grid" role="grid" aria-label="Sudoku grid"></div>
  <div class="row tools">
    <button id="notes" aria-pressed="false">✎ Notes</button>
    <button id="erase">Erase</button>
    <button id="undo">Undo</button>
    <label class="row" style="gap:.35rem"><input type="checkbox" id="check" checked> Show mistakes</label>
  </div>
  <div class="pad" id="pad" aria-label="Numbers"></div>
  <p class="msg" id="msg" role="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
